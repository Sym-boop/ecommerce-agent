# 生产部署：单机版（前端 + 后端 + 可选中间件）
#
# 设计取向：**先能跑起来，再谈扩容**。
# - 不启 Milvus：它要 etcd + MinIO，2C4G 的机器起不动；且代码本身有
#   TF-IDF 降级通道，Milvus 不可达时检索依然可用（实测 P@3 67.82% 就是降级通道测的）。
# - 不启 MySQL：单实例用 JSON + 数据卷最省事、最不容易出错。
#   要多实例请启用文件末尾的 mysql 服务，并把 STORE_BACKEND 改为 mysql。
# - 后端只跑 1 worker：JSON 存储与 SqliteSaver 都是单机假设。
#
# 启动：
#   cp .env.prod.example .env.prod      # 填 LLM_API_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f backend
# 访问：http://<服务器IP>

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-agent-backend:latest
    container_name: ea-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # 单机部署的关键配置（要改就改这里，别改镜像）
      STORE_BACKEND: json
      RAG_RERANK: "1"
      QIANCHUAN_DELIVERY_MODE: mock     # 无平台授权前必须 mock
      TZ: Asia/Shanghai
      # 容器内的 Milvus 地址：默认留空 → 代码走本地 TF-IDF 降级
      MILVUS_URI: ""
    volumes:
      # 数据卷：物料、审批、素材、checkpoint 全在这
      - ea_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # 2C4G 机器给后端留足内存（Playwright 渲染海报比想象中吃内存）
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecommerce-agent-frontend:latest
    container_name: ea-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  ea_data:
    driver: local

